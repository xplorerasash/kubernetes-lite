name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------
  # 1. Static analysis + unit tests (runs on every push/PR)
  # ---------------------------------------------------------------
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 app tests

      - name: Unit tests (pytest)
        run: pytest -v --tb=short

  # ---------------------------------------------------------------
  # 2. Build image and smoke-test it against a real Docker daemon
  # ---------------------------------------------------------------
  build-smoke:
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kubernetes-lite:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (container boots, API healthy)
        run: |
          docker run -d --name smoke \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -p 5000:5000 \
            kubernetes-lite:${{ github.sha }}

          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/health >/dev/null; then break; fi
            sleep 2
          done

          echo "Health endpoint:"
          curl -sf http://localhost:5000/api/health | tee /dev/stderr | grep -q '"healthy"'

          docker rm -f smoke >/dev/null

  # ---------------------------------------------------------------
  # 3. Push to Docker Hub (main branch only, requires secrets)
  # ---------------------------------------------------------------
  push:
    name: Push Image
    runs-on: ubuntu-latest
    needs: build-smoke
    # runs only when Docker Hub credentials are configured;
    # otherwise the stage is skipped and CI stays green
    if: github.ref == 'refs/heads/main' && secrets.DOCKERHUB_USERNAME != ''
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push (latest + sha tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kubernetes-lite:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kubernetes-lite:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # 4. Deploy to the VM (main branch only).
  #    Attach an environment named "production" with required
  #    reviewers on GitHub to get a manual approval gate here.
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: push
    # runs only when VM hosting credentials are configured
    if: github.ref == 'refs/heads/main' && secrets.DEPLOY_HOST != ''
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            K8SLITE_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/kubernetes-lite:${{ github.sha }} \
              bash deploy/deploy.sh
